name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge script
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Bundled bridge.js is up to date
        run: |
          node build.mjs
          git diff --exit-code -- ../app/src/main/assets/bridge.js

  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      HB_VERSION_CODE: ${{ github.run_number }}
      HB_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21: emoji-aware grapheme breaking in java.text.BreakIterator (JDK 20+),
          # matching Android's ICU-backed implementation that the app runs on.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew -p core test

      - name: Decode release signing key
        env:
          KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: hyperbeam-${{ env.HB_VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
